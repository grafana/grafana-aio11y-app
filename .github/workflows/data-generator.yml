name: AI Observability Data Generator

# SECURITY NOTE: This workflow uses workflow inputs for demonstration purposes.
# For production use, consider using GitHub Secrets instead of workflow inputs
# to prevent sensitive data exposure in logs. See .github/scripts/README.md for details.

on:
  workflow_dispatch:
    inputs:
      mock_type:
        description: 'Select mock data type to generate'
        required: true
        default: 'llm'
        type: choice
        options:
          - llm
          - vectordb
          - both
      otel_endpoint:
        description: 'OTEL Endpoint URL'
        required: true
        default: 'https://otlp-gateway-prod-us-east-1.grafana.net/otlp'
        type: string
      otel_headers:
        description: 'OTEL Headers (Authorization header)'
        required: true
        type: string
      service_name:
        description: 'Service Name'
        required: false
        default: 'ai-observability-data'
        type: string
      deployment_environment:
        description: 'Deployment Environment'
        required: false
        default: 'demo'
        type: string
      openai_api_key:
        description: 'OpenAI API Key (optional but recommended)'
        required: false
        type: string
      anthropic_api_key:
        description: 'Anthropic API Key (optional but recommended)'
        required: false
        type: string

jobs:
  llm-mock-data:
    if: ${{ github.event.inputs.mock_type == 'llm' || github.event.inputs.mock_type == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt
          
      - name: Validate API Keys
        env:
          OPENAI_API_KEY: ${{ github.event.inputs.openai_api_key }}
          ANTHROPIC_API_KEY: ${{ github.event.inputs.anthropic_api_key }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "❌ Error: At least one API key (OpenAI or Anthropic) must be provided"
            exit 1
          fi
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "✅ OpenAI API key provided (${#OPENAI_API_KEY} characters)"
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "✅ Anthropic API key provided (${#ANTHROPIC_API_KEY} characters)"
          fi
          
      - name: Mask sensitive values in logs
        run: |
          echo "🔐 Masking sensitive values to prevent exposure in logs..."
          if [ -n "${{ github.event.inputs.openai_api_key }}" ]; then
            echo "::add-mask::${{ github.event.inputs.openai_api_key }}"
          fi
          if [ -n "${{ github.event.inputs.anthropic_api_key }}" ]; then
            echo "::add-mask::${{ github.event.inputs.anthropic_api_key }}"
          fi
          if [ -n "${{ github.event.inputs.otel_headers }}" ]; then
            echo "::add-mask::${{ github.event.inputs.otel_headers }}"
          fi
          echo "✅ Sensitive values masked from GitHub Actions logs"
          
      - name: Generate LLM Mock Data
        timeout-minutes: 10
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ github.event.inputs.otel_endpoint }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ github.event.inputs.otel_headers }}
          OTEL_SERVICE_NAME: ${{ github.event.inputs.service_name }}
          OTEL_DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.deployment_environment }}
          OPENAI_API_KEY: ${{ github.event.inputs.openai_api_key }}
          ANTHROPIC_API_KEY: ${{ github.event.inputs.anthropic_api_key }}
        run: python .github/scripts/llm_data_generator.py

  vectordb-mock-data:
    if: ${{ github.event.inputs.mock_type == 'vectordb' || github.event.inputs.mock_type == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt
          
      - name: Mask sensitive values in logs
        run: |
          echo "🔐 Masking sensitive values to prevent exposure in logs..."
          if [ -n "${{ github.event.inputs.otel_headers }}" ]; then
            echo "::add-mask::${{ github.event.inputs.otel_headers }}"
          fi
          echo "✅ Sensitive values masked from GitHub Actions logs"
          
      - name: Generate Vector Database Mock Data
        timeout-minutes: 10
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ github.event.inputs.otel_endpoint }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ github.event.inputs.otel_headers }}
          OTEL_SERVICE_NAME: ${{ github.event.inputs.service_name }}
          OTEL_DEPLOYMENT_ENVIRONMENT: ${{ github.event.inputs.deployment_environment }}
        run: python .github/scripts/vectordb_data_generator.py
